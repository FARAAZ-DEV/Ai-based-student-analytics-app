<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ action }} Student</title>
{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
  <nav class="navbar">
    <span class="nav-brand">🎓 Student Analytics</span>
    <div class="nav-links">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme" aria-pressed="false">
        <span class="toggle-track">
          <span class="toggle-thumb">🌙</span>
        </span>
      </button>
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'logout' %}">Logout</a>
    </div>
  </nav>

  <div class="container" style="max-width:520px;margin-top:2rem;">
    <div class="card">
      <h2>{{ action }} Student</h2>
      {% if error %}<div class="alert">{{ error }}</div>{% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="field">
          <label>Full Name</label>
          <input type="text" name="name" value="{{ student.name|default:'' }}" required>
        </div>
        <div class="field">
          <label>Roll No</label>
          <input type="text" name="roll_no" value="{{ student.roll_no|default:'' }}" required>
        </div>
        <div class="field">
          <label>Marks (0–100)</label>
          <input type="number" name="marks" min="0" max="100" step="0.1"
                 value="{{ student.marks|default:'' }}" required>
        </div>
        <div class="field">
          <label>Attendance % (0–100)</label>
          <input type="number" name="attendance" min="0" max="100" step="0.1"
                 value="{{ student.attendance|default:'' }}" required>
        </div>
        <div style="display:flex;gap:1rem;margin-top:1.5rem;">
          <button type="submit" class="btn-primary">💾 Save</button>
          <a href="{% url 'dashboard' %}" class="btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
  <script>
    const applyTheme = (theme) => {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('student-theme', theme);
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        const thumb = themeToggle.querySelector('.toggle-thumb');
        const isDark = theme === 'dark';
        themeToggle.classList.toggle('is-dark', isDark);
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        if (thumb) thumb.textContent = isDark ? '☀️' : '🌙';
      }
    };

    const savedTheme = localStorage.getItem('student-theme') || 'light';
    applyTheme(savedTheme);

    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const nextTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
      });
    }
  </script>
</body>
</html>
