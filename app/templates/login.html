<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Student Analytics</title>
{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-page">
  <button type="button" class="theme-toggle login-toggle" id="themeToggle" aria-label="Toggle theme" aria-pressed="false">
    <span class="toggle-track">
      <span class="toggle-thumb">🌙</span>
    </span>
  </button>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-icon">🎓</div>
      <h1>Student Analytics</h1>
      <p class="login-sub">Admin Portal</p>
      {% if error %}<div class="alert">{{ error }}</div>{% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" placeholder="admin" required autofocus>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary full">Sign In</button>
      </form>
      <p class="hint">Default: admin / admin123</p>
    </div>
  </div>
  <script>
    const applyTheme = (theme) => {
      document.body.setAttribute('data-theme', theme);
      localStorage.setItem('student-theme', theme);
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        const thumb = themeToggle.querySelector('.toggle-thumb');
        const isDark = theme === 'dark';
        themeToggle.classList.toggle('is-dark', isDark);
        themeToggle.setAttribute('aria-pressed', String(isDark));
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        if (thumb) thumb.textContent = isDark ? '☀️' : '🌙';
      }
    };

    const savedTheme = localStorage.getItem('student-theme') || 'light';
    applyTheme(savedTheme);

    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const nextTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
      });
    }
  </script>
</body>
</html>
